    <script>
      (function() {
        try {
          var saved = localStorage.getItem('onyx_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved ? saved : (prefersDark !== false ? 'dark' : 'light');
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#080A0F] text-[#F5F5F7] antialiased selection:bg-[#8B5CF6]/30 selection:text-[#35D9D0]">

  </body>
